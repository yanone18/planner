<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#263e62"><title>予定表・試作品</title><style>

:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#243247}*{box-sizing:border-box}body{margin:0;background:#f3f5f8}.app{max-width:650px;margin:auto;min-height:100dvh;background:#fff}.top{background:#fff;color:#243247;padding:12px 12px 0;border-bottom:1px solid #dce2e9}.brand{text-align:center;font-size:11px;letter-spacing:.20em;margin-bottom:12px;color:#758397}.tabs{display:flex;gap:4px}.tab{flex:1;min-width:0;padding:12px 2px;background:transparent;border:0;border-bottom:3px solid transparent;color:#78879a;font-weight:600;font-size:15px;touch-action:pan-y}.tab.active{background:#fff;color:#294f83;border-bottom-color:#3973b5}.sheet{height:calc(100dvh - 98px);overflow:auto;overscroll-behavior:contain;background:#fff}.sheet.locked{overflow:hidden;touch-action:none}.dayrow,.taskrow{min-height:45px;display:flex;align-items:stretch;border-bottom:1px solid #e8edf2;background:#fff}.dayrow.rest,.task-date.rest{background:#fff3b9}.date{width:112px;flex-shrink:0;border-right:1px solid #edf0f4;padding:11px 5px;text-align:center;font-size:13px;white-space:nowrap;user-select:none;color:#526175}.date.sat,.task-date.sat{color:#1769bd}.date.sun,.task-date.sun{color:#c03d4a}.entry{flex:1;min-width:0;display:flex;align-items:center;padding:2px 8px}.entry input,.taskrow input{width:100%;min-width:0;background:transparent;border:0;outline:0;font-size:16px;color:#243247;padding:8px 2px;border-radius:0}.entry input:focus,.taskrow input:focus{background:#f4f8ff}.task-date{padding:13px 16px;border-bottom:1px solid #dfe5ed;font-weight:600;background:#fff;color:#526175}.taskrow{padding-left:13px}.taskrow input{flex:1}.delete{border:0;background:transparent;font-size:20px;color:#a43c4d;padding:0 14px}.memo{padding:16px;background:#fff;min-height:100%}.memo textarea{width:100%;height:calc(100dvh - 150px);resize:none;border:0;outline:0;background:#fff;font:16px/1.9 -apple-system,BlinkMacSystemFont,sans-serif;color:#243247;touch-action:auto}.done,.today{position:fixed;right:max(18px,calc((100vw - 650px)/2 + 18px));bottom:22px;border:0;border-radius:50%;width:52px;height:52px;background:#315f97;color:white;font-size:26px;box-shadow:0 3px 12px #263e6229}.today{bottom:86px;font-size:24px}.hidden{display:none!important}.note{padding:10px 15px;background:#f3f7fc;font-size:12px;color:#60718a;border-bottom:1px solid #e5ebf2}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 14px 9px;background:#fff}.toolbar span{font-size:12px;color:#758397}.menu{border:0;background:transparent;font-size:22px;color:#315f97}.trashview{padding:16px}.trashitem{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #e5eaf0}.trashitem button{padding:8px 12px}.small{font-size:12px;color:#758397}
</style></head><body><div class="app"><header class="top"><div class="brand">PLANNER</div><nav class="tabs" id="tabs"></nav></header><div class="toolbar"><span id="status">操作確認用の試作品</span><button class="menu" id="menu" aria-label="メニュー">⋯</button></div><div class="note" id="notice">試作品：このブラウザ内で一時保存します。バックアップ・繰り返し予定などは未実装です。</div><main class="sheet" id="sheet"></main></div><button id="today" class="today hidden" aria-label="今日に戻る">↑</button><button id="done" class="done hidden" aria-label="編集終了">✓</button><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const key='planner-prototype-v1';let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}state=Object.assign({order:['予定表','ToDo','メモ'],schedule:{},rest:{},tasks:[],memo:'',trash:[]},state||{});let current=state.order[1],editing=false,active=null,scrolls={},trashOpen=false;const save=()=>localStorage.setItem(key,JSON.stringify(state));const weekday=['日','月','火','水','木','金','土'];const label=d=>`${d.getMonth()+1}/${d.getDate()}（${weekday[d.getDay()]}）`;const color=d=>d.getDay()===0?'sun':d.getDay()===6?'sat':'';const h=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el};const setEdit=(el)=>{editing=true;active=el;$('sheet').classList.add('locked');$('done').classList.remove('hidden');$('today').classList.add('hidden');const row=el.closest('.dayrow,.taskrow');if(row){const r=row.getBoundingClientRect(),bottom=window.visualViewport?.height||window.innerHeight;if(r.bottom>bottom-70) $('sheet').scrollTop+=r.bottom-bottom+100}};const finish=()=>{if(active)active.blur();editing=false;active=null;$('sheet').classList.remove('locked');$('done').classList.add('hidden');render(false)};const inputEvents=el=>{el.addEventListener('focus',()=>setEdit(el));el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&current!=='メモ'){e.preventDefault();finish()}})};const tabs=()=>{const bar=$('tabs');bar.replaceChildren();state.order.forEach(name=>{const b=h('button','tab'+(name===current?' active':''),name);b.type='button';b.draggable=true;b.onclick=()=>switchTo(name);b.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',name));b.addEventListener('dragover',e=>e.preventDefault());b.addEventListener('drop',e=>{e.preventDefault();const from=e.dataTransfer.getData('text/plain'),a=state.order.indexOf(from),z=state.order.indexOf(name);if(a>=0&&z>=0){state.order.splice(a,1);state.order.splice(z,0,from);save();tabs()}});let timer,started=false;b.addEventListener('touchstart',()=>{timer=setTimeout(()=>{started=true;b.draggable=true;b.style.opacity='.55'},550)},{passive:true});b.addEventListener('touchend',e=>{clearTimeout(timer);b.style.opacity='';if(started){started=false;const touch=e.changedTouches[0],target=document.elementFromPoint(touch.clientX,touch.clientY)?.closest('.tab');if(target){const dest=target.textContent,a=state.order.indexOf(name),z=state.order.indexOf(dest);if(a>=0&&z>=0){state.order.splice(a,1);state.order.splice(z,0,name);save();tabs()}}}});b.addEventListener('touchcancel',()=>{clearTimeout(timer);b.style.opacity=''});bar.append(b)})};const switchTo=name=>{if(editing)return;scrolls[current]=$('sheet').scrollTop;current=name;trashOpen=false;render(true)};const render=restore=>{tabs();const sheet=$('sheet');sheet.replaceChildren();sheet.classList.toggle('locked',editing);$('status').textContent=trashOpen?'ToDoのゴミ箱':current;$('today').classList.add('hidden');if(trashOpen){const v=h('div','trashview');const back=h('button','','← ToDoへ戻る');back.onclick=()=>{trashOpen=false;render(false)};v.append(back);state.trash.forEach((item,i)=>{const row=h('div','trashitem');row.append(h('span','',item.text));const btn=h('button','','復元');btn.onclick=()=>{state.tasks.push(item.text);state.trash.splice(i,1);save();render(false)};row.append(btn);v.append(row)});sheet.append(v);return}if(current==='予定表'){const start=today(),end=new Date(start.getFullYear()+5,start.getMonth(),start.getDate());let d=new Date(start),count=0;while(d<=end){const id=iso(d),row=h('div','dayrow'+(state.rest[id]?' rest':''));const date=h('div','date '+color(d),label(d));date.title='タップで休みを切り替え';date.onclick=()=>{if(editing)return;state.rest[id]=!state.rest[id];save();row.classList.toggle('rest',!!state.rest[id])};const entry=h('div','entry');const inp=h('input');inp.type='text';inp.value=state.schedule[id]||'';inp.setAttribute('aria-label',`${id}の予定`);inp.oninput=()=>{state.schedule[id]=inp.value;save()};inputEvents(inp);entry.append(inp);row.append(date,entry);sheet.append(row);d.setDate(d.getDate()+1);count++}sheet.onscroll=()=>{$('today').classList.toggle('hidden',editing||sheet.scrollTop<50)};}else if(current==='ToDo'){const d=today(),dt=h('div','task-date '+color(d),label(d));dt.classList.toggle('rest',!!state.rest[iso(d)]);sheet.append(dt);state.tasks.forEach((value,i)=>{const row=h('div','taskrow'),inp=h('input');inp.type='text';inp.value=value;inp.oninput=()=>{state.tasks[i]=inp.value;save()};inputEvents(inp);const del=h('button','delete hidden','♧');del.textContent='🗑';del.setAttribute('aria-label','ゴミ箱へ移動');inp.addEventListener('focus',()=>del.classList.remove('hidden'));inp.addEventListener('blur',()=>del.classList.add('hidden'));del.onpointerdown=e=>e.preventDefault();del.onclick=()=>{state.trash.push({text:state.tasks[i],deletedAt:Date.now()});state.tasks.splice(i,1);save();finish()};row.append(inp,del);sheet.append(row)});const row=h('div','taskrow'),inp=h('input');inp.placeholder='新しいToDoを入力';inp.oninput=()=>{if(inp.value){state.tasks.push(inp.value);save();const start=inp.selectionStart;render(false);const inputs=sheet.querySelectorAll('input');const next=inputs[inputs.length-2];next?.focus();next?.setSelectionRange(start,start)}};inputEvents(inp);row.append(inp);sheet.append(row);sheet.onscroll=null}else{const box=h('div','memo'),area=h('textarea');area.value=state.memo;area.placeholder='ここにメモを入力';area.oninput=()=>{state.memo=area.value;save()};inputEvents(area);box.append(area);sheet.append(box);sheet.onscroll=null}if(restore)sheet.scrollTop=scrolls[current]||0;else sheet.scrollTop=0};$('done').onclick=finish;$('today').onclick=()=>{$('sheet').scrollTo({top:0,behavior:'smooth'})};$('menu').onclick=()=>{if(editing)return;if(current==='ToDo'){const ans=confirm('ToDoのゴミ箱を開きますか？\n（バックアップ・復元は次の制作段階で追加します）');if(ans){trashOpen=true;render(false)}}else alert('バックアップ・復元は次の制作段階で追加します。')};let startX=0,startY=0;$('sheet').addEventListener('touchstart',e=>{if(!editing&&e.touches.length===1){startX=e.touches[0].clientX;startY=e.touches[0].clientY}},{passive:true});$('sheet').addEventListener('touchend',e=>{if(editing||trashOpen||!startX)return;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;startX=0;if(Math.abs(dx)>85&&Math.abs(dx)>Math.abs(dy)*1.6){const index=state.order.indexOf(current)+(dx<0?1:-1);if(state.order[index])switchTo(state.order[index])}},{passive:true});state.trash=state.trash.filter(x=>Date.now()-(x.deletedAt||0)<30*86400000);save();render(false);})();
</script></body></html>
