<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#263e62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="予定表">
<link rel="apple-touch-icon" href="apple-touch-icon.PNG">
<link rel="manifest" href="./manifest.webmanifest">
<title>予定表</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#243247}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f3f5f8}
body{overflow:hidden}
button,input,textarea{font:inherit}
.app{max-width:650px;width:100%;height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.top{position:relative;z-index:5;flex:none;background:#fff;color:#243247;padding:7px 10px 0;border-bottom:1px solid #e7ebf0;padding-top:max(7px,env(safe-area-inset-top))}
.brand{text-align:center;font-size:10px;letter-spacing:.2em;margin:0 0 5px;color:#758397}
.tabs{display:flex;gap:3px}
.tab{flex:1;min-width:0;padding:9px 2px;background:transparent;border:0;border-bottom:2px solid transparent;color:#78879a;font-weight:600;font-size:14px;touch-action:pan-y}
.tab.active{background:#fff;color:#294f83;border-bottom-color:#3973b5}
.toolbar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px 5px;background:#fff;min-height:26px}
.toolbar span{font-size:11px;color:#758397}
.menu{border:0;background:transparent;font-size:21px;color:#315f97;padding:0 3px;line-height:1.2}
.note{flex:none;padding:6px 12px;background:#f7f9fc;font-size:11px;color:#60718a;border-bottom:1px solid #e5ebf2}
.sheet{position:relative;flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;background:#fff;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet.locked{overflow:hidden;touch-action:none}
.sheet.transition-in-right{animation:slideFromRight .22s ease-out}
.sheet.transition-in-left{animation:slideFromLeft .22s ease-out}
@keyframes slideFromRight{from{transform:translateX(28px);opacity:.65}to{transform:translateX(0);opacity:1}}
@keyframes slideFromLeft{from{transform:translateX(-28px);opacity:.65}to{transform:translateX(0);opacity:1}}
.dayrow{min-height:43px;display:flex;align-items:stretch;background:#fff}
.dayrow.rest,.task-date.rest{background:#fff9df}
.date{width:76px;flex:0 0 76px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px 0 2px;text-align:right;font-size:13px;white-space:nowrap;user-select:none;color:#526175;border:0}
.date.sat,.task-date.sat{color:#1769bd}
.date.sun,.task-date.sun{color:#c03d4a}
.entry{flex:1;min-width:0;display:flex;align-items:center;padding:2px 8px}
.entry input,.taskrow input{width:100%;min-width:0;background:transparent;border:0;outline:0;font-size:16px;color:#243247;padding:8px 2px;border-radius:0}
.entry input:focus,.taskrow input:focus{background:#f4f8ff}
.task-day{padding:0 0 10px}
.task-date{position:sticky;top:0;z-index:2;display:flex;align-items:center;min-height:35px;padding:7px 13px;font-size:13px;font-weight:700;background:#f7f9fc;color:#526175;border-bottom:1px solid #edf0f4}
.taskrow{min-height:39px;display:flex;align-items:center;padding-left:13px;background:#fff}
.taskrow input{flex:1}
.delete{border:0;background:transparent;font-size:18px;color:#a43c4d;padding:0 13px;min-height:38px}
.addtask{width:100%;text-align:left;padding:8px 15px 8px 26px;border:0;background:#fff;color:#8793a3;font-size:14px}
.memo{padding:12px 15px;background:#fff;min-height:100%}
.memo textarea{display:block;width:100%;height:100%;min-height:180px;resize:none;border:0;outline:0;background:#fff;font:15px/1.8 -apple-system,BlinkMacSystemFont,sans-serif;color:#243247;caret-color:#315f97;touch-action:auto}
.today{position:fixed;z-index:4;right:max(16px,calc((100vw - 650px)/2 + 16px));bottom:max(18px,env(safe-area-inset-bottom));border:0;border-radius:50%;width:46px;height:46px;background:#315f97;color:white;font-size:23px;box-shadow:0 3px 12px #263e6229}
.hidden{display:none!important}
.trashview{padding:14px}
.trashitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #e5eaf0}
.trashitem button{padding:8px 12px}
.dialog-backdrop{position:fixed;inset:0;z-index:20;background:#17243b66;display:flex;align-items:center;justify-content:center;padding:20px}
.dialog{width:min(100%,360px);background:white;border-radius:14px;padding:18px;box-shadow:0 12px 40px #17243b33}
.dialog h2{font-size:17px;margin:0 0 8px}
.dialog p{font-size:13px;line-height:1.6;color:#64748b}
.dialog button{border:1px solid #d9e0e8;background:#fff;border-radius:9px;padding:10px 12px}
.dialog .primary{background:#315f97;color:white;border-color:#315f97}
.dialog-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">PLANNER</div><nav class="tabs" id="tabs" aria-label="画面切り替え"></nav></header>
<div class="toolbar"><span id="status">予定表</span><button class="menu" id="menu" aria-label="メニュー">⋯</button></div>
<main class="sheet" id="sheet"></main>
</div>
<button id="today" class="today hidden" aria-label="今日に戻る">↑</button>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const weekday=['日','月','火','水','木','金','土'];
const label=d=>`${d.getMonth()+1}/${d.getDate()}（${weekday[d.getDay()]}）`;
const color=d=>d.getDay()===0?'sun':d.getDay()===6?'sat':'';
const h=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el};
const storageKey='planner-prototype-v1';
let state;try{state=JSON.parse(localStorage.getItem(storageKey))}catch{}
state=Object.assign({order:['予定表','ToDo','メモ'],schedule:{},rest:{},tasks:[],tasksByDate:{},memo:'',trash:[],repeats:[]},state||{});
if(!state.tasksByDate)state.tasksByDate={};
if(!state.repeats)state.repeats=[];
// Preserve the previous single ToDo list by moving it to today's list only once.
if(Array.isArray(state.tasks)&&state.tasks.length){
 const k=iso(today());state.tasksByDate[k]=[...(state.tasksByDate[k]||[]),...state.tasks];state.tasks=[]; 
}
let current=state.order.includes('予定表')?'予定表':state.order[0],editing=false,active=null,scrolls={},trashOpen=false,transitionDirection=1;
const save=()=>localStorage.setItem(storageKey,JSON.stringify(state));
const get8Days=()=>{const arr=[],d=today();for(let i=0;i<8;i++){const x=new Date(d);x.setDate(d.getDate()+i);arr.push(x)}return arr};
const isRepeatMatch=(rule,d)=>{const start=new Date(rule.start+'T00:00:00');if(d<start)return false;if(rule.until&&iso(d)>rule.until)return false;if(rule.freq==='daily')return true;if(rule.freq==='weekly')return d.getDay()===start.getDay();if(rule.freq==='monthly')return d.getDate()===start.getDate();if(rule.freq==='yearly')return d.getMonth()===start.getMonth()&&d.getDate()===start.getDate();return false};
const scheduleValue=(id,d)=>{if(state.schedule[id])return state.schedule[id];const rules=(state.repeats||[]).filter(r=>isRepeatMatch(r,d)).sort((a,b)=>b.start.localeCompare(a.start));return rules.length?rules[0].text:''};
const setEditing=(el)=>{editing=true;active=el;el.dataset.editing='1';$('sheet').classList.add('locked');};
const finish=()=>{if(active)active.blur();editing=false;active=null;$('sheet').classList.remove('locked');$('sheet').querySelectorAll('[data-editing]').forEach(e=>delete e.dataset.editing);render(false)};
const inputEvents=(el,opts={})=>{
 el.addEventListener('focus',()=>setEditing(el));
 el.addEventListener('blur',()=>{if(active===el){editing=false;active=null;$('sheet').classList.remove('locked');}});
 el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&current!=='メモ'){e.preventDefault();if(opts.onEnter)opts.onEnter();else finish()}});
};
const showDialog=(title,desc,buttons)=>{const back=h('div','dialog-backdrop'),box=h('div','dialog');box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.append(h('h2','',title),h('p','',desc));const actions=h('div','dialog-actions');buttons.forEach(b=>{const btn=h('button',b.primary?'primary':'',b.label);btn.onclick=()=>{back.remove();b.action&&b.action()};actions.append(btn)});box.append(actions);back.append(box);document.body.append(back)};
const repeatDialog=(id,d,text)=>{if(!text.trim()){showDialog('繰り返し設定','先にこの日の予定を入力してね。',[{label:'閉じる',primary:true}]);return}
 showDialog('繰り返し設定',`${label(d)}「${text}」を繰り返す頻度を選んでね。`,[
 {label:'毎週',action:()=>addRepeat(id,text,'weekly')},
 {label:'毎月',action:()=>addRepeat(id,text,'monthly')},
 {label:'毎年',action:()=>addRepeat(id,text,'yearly')},
 {label:'解除',action:()=>{state.repeats=state.repeats.filter(r=>!(r.start===id));save();render(false)}},
 {label:'キャンセル'}
 ])};
const addRepeat=(id,text,freq)=>{state.repeats=state.repeats.filter(r=>r.start!==id);state.repeats.push({start:id,text,freq});save();render(false)};
const tabs=()=>{const bar=$('tabs');bar.replaceChildren();state.order.forEach(name=>{const b=h('button','tab'+(name===current?' active':''),name);b.type='button';b.onclick=()=>switchTo(name);bar.append(b)})};
const switchTo=name=>{if(editing)return;scrolls[current]=$('sheet').scrollTop;transitionDirection=state.order.indexOf(name)>state.order.indexOf(current)?1:-1;current=name;trashOpen=false;render(true)};
const render=restore=>{
 tabs();const sheet=$('sheet');sheet.replaceChildren();sheet.classList.toggle('locked',editing);sheet.classList.remove('transition-in-left','transition-in-right');
 $('status').textContent=trashOpen?'ToDoのゴミ箱':current;$('today').classList.add('hidden');
 if(trashOpen){const v=h('div','trashview');const back=h('button','','← ToDoへ戻る');back.onclick=()=>{trashOpen=false;render(false)};v.append(back);state.trash.forEach((item,i)=>{const row=h('div','trashitem');row.append(h('span','',item.text));const btn=h('button','','復元');btn.onclick=()=>{if(item.date){state.tasksByDate[item.date]=state.tasksByDate[item.date]||[];state.tasksByDate[item.date].push(item.text)}else{state.tasksByDate[iso(today())]=state.tasksByDate[iso(today())]||[];state.tasksByDate[iso(today())].push(item.text)}state.trash.splice(i,1);save();render(false)};row.append(btn);v.append(row)});sheet.append(v);return}
 if(current==='予定表'){
  const start=today(),end=new Date(start.getFullYear()+5,start.getMonth(),start.getDate());let d=new Date(start);
  while(d<=end){const id=iso(d),row=h('div','dayrow'+(state.rest[id]?' rest':'')),date=h('div','date '+color(d),label(d)),entry=h('div','entry'),inp=h('input');
   date.title='タップで休みを切り替え';date.onclick=()=>{if(editing)return;state.rest[id]=!state.rest[id];save();row.classList.toggle('rest',!!state.rest[id])};
   inp.type='text';inp.value=scheduleValue(id,d);inp.setAttribute('aria-label',`${id}の予定`);inp.oninput=()=>{state.schedule[id]=inp.value;save()};
   inputEvents(inp);
   let timer=null,longPressed=false;row.addEventListener('touchstart',e=>{if(editing||e.touches.length!==1)return;longPressed=false;timer=setTimeout(()=>{longPressed=true;repeatDialog(id,d,inp.value||scheduleValue(id,d));},650)},{passive:true});
   row.addEventListener('touchend',()=>clearTimeout(timer));row.addEventListener('touchmove',()=>clearTimeout(timer),{passive:true});row.addEventListener('contextmenu',e=>{e.preventDefault();repeatDialog(id,d,inp.value||scheduleValue(id,d))});
   entry.append(inp);row.append(date,entry);sheet.append(row);d.setDate(d.getDate()+1);
  }
  sheet.onscroll=()=>{$('today').classList.toggle('hidden',editing||sheet.scrollTop<50)};
 }else if(current==='ToDo'){
  get8Days().forEach(d=>{
   const id=iso(d),group=h('section','task-day'),head=h('div','task-date '+color(d),label(d));head.classList.toggle('rest',!!state.rest[id]);group.append(head);
   const tasks=state.tasksByDate[id]||(state.tasksByDate[id]=[]);
   tasks.forEach((value,i)=>{const row=h('div','taskrow'),inp=h('input'),del=h('button','delete hidden','🗑');inp.type='text';inp.value=value;inp.setAttribute('aria-label',`${id}のToDo`);inp.oninput=()=>{state.tasksByDate[id][i]=inp.value;save()};inputEvents(inp);inp.addEventListener('focus',()=>del.classList.remove('hidden'));inp.addEventListener('blur',()=>del.classList.add('hidden'));del.onpointerdown=e=>e.preventDefault();del.onclick=()=>{state.trash.push({text:state.tasksByDate[id][i],date:id,deletedAt:Date.now()});state.tasksByDate[id].splice(i,1);save();finish()};row.append(inp,del);group.append(row)});
   const add=h('button','addtask','＋ ToDoを追加');add.onclick=()=>{state.tasksByDate[id].push('');save();render(false);const groups=sheet.querySelectorAll('.task-day'),gi=get8Days().findIndex(x=>iso(x)===id),last=groups[gi]?.querySelectorAll('input');const target=last?.[last.length-1];if(target){target.focus();target.scrollIntoView({block:'nearest'})}};group.append(add);sheet.append(group);
  });sheet.onscroll=null;
 }else{
  const box=h('div','memo'),area=h('textarea');area.value=state.memo;area.placeholder='ここにメモを入力';area.oninput=()=>{state.memo=area.value;save()};inputEvents(area);box.append(area);sheet.append(box);sheet.onscroll=null;
 }
 if(restore)sheet.scrollTop=scrolls[current]||0;else sheet.scrollTop=0;
 if(!restore){sheet.classList.add(transitionDirection>0?'transition-in-right':'transition-in-left')}
};
$('menu').onclick=()=>{if(editing)return;if(current==='ToDo'){showDialog('ToDoのゴミ箱','削除したToDoを確認できるよ。',[{label:'ゴミ箱を開く',primary:true,action:()=>{trashOpen=true;render(false)}},{label:'キャンセル'}])}else showDialog('予定表','繰り返し設定は、予定の行を長押しして開けるよ。',[{label:'閉じる',primary:true}])};
$('today').onclick=()=>{$('sheet').scrollTo({top:0,behavior:'smooth'})};
$('sheet').addEventListener('touchstart',e=>{if(!editing&&e.touches.length===1){window.__swipeStartX=e.touches[0].clientX;window.__swipeStartY=e.touches[0].clientY}},{passive:true});
$('sheet').addEventListener('touchend',e=>{if(editing||trashOpen||window.__swipeStartX==null)return;const dx=e.changedTouches[0].clientX-window.__swipeStartX,dy=e.changedTouches[0].clientY-window.__swipeStartY;window.__swipeStartX=null;if(Math.abs(dx)>85&&Math.abs(dx)>Math.abs(dy)*1.6){const index=state.order.indexOf(current)+(dx<0?1:-1);if(state.order[index])switchTo(state.order[index])}},{passive:true});
state.trash=(state.trash||[]).filter(x=>Date.now()-(x.deletedAt||0)<30*86400000);save();render(false);
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
